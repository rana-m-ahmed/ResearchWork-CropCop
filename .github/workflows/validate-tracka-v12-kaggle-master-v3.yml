name: Validate Track-A v1.2 Kaggle master v3

on:
  push:
    branches:
      - ops-tracka-kaggle-master-v3-20260913
    paths:
      - 'journal_extension/kaggle/tracka_v12_ops/**'
      - 'tests/test_tracka_v12_kaggle_ops.py'
      - 'tests/test_tracka_v12_kaggle_ops_runtime.py'
      - 'tests/test_tracka_v12_kaggle_master_v3.py'
      - '.github/workflows/validate-tracka-v12-kaggle-master-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracka-v12-kaggle-master-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  master-operator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout master operator branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up frozen Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'

      - name: Verify additive separation from frozen science source
        shell: bash
        run: |
          set -euo pipefail
          SCIENCE_SHA='9a72e9466a9a3e7429e0e36a028edac662f83146'
          git cat-file -e "${SCIENCE_SHA}^{commit}"
          test "$(git merge-base "$SCIENCE_SHA" HEAD)" = "$SCIENCE_SHA"
          git diff --name-status "$SCIENCE_SHA"..HEAD > /tmp/tracka_master_diff.txt
          cat /tmp/tracka_master_diff.txt
          python - <<'PY'
          from pathlib import Path
          allowed_exact = {
              '.github/workflows/validate-tracka-v12-kaggle-ops.yml',
              '.github/workflows/validate-tracka-v12-kaggle-master-v3.yml',
              'tests/test_tracka_v12_kaggle_ops.py',
              'tests/test_tracka_v12_kaggle_ops_runtime.py',
              'tests/test_tracka_v12_kaggle_master_v3.py',
          }
          allowed_prefix = 'journal_extension/kaggle/tracka_v12_ops/'
          rows = []
          for raw in Path('/tmp/tracka_master_diff.txt').read_text(encoding='utf-8').splitlines():
              if not raw.strip():
                  continue
              parts = raw.split('\t')
              status, paths = parts[0], parts[1:]
              rows.append((status, paths))
              if status != 'A':
                  raise SystemExit(f'master operator branch is not additive-only: {raw}')
              for path in paths:
                  if path not in allowed_exact and not path.startswith(allowed_prefix):
                      raise SystemExit(f'master operator branch changed non-operator path: {path}')
          if not rows:
              raise SystemExit('master operator diff unexpectedly empty')
          print(f'additive master-operator diff PASS: {len(rows)} files')
          PY

      - name: Validate frozen runtime and exact three-notebook distribution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          SCIENCE_SHA = '9a72e9466a9a3e7429e0e36a028edac662f83146'
          RUNTIME_SHA = 'e8ea268729663a921db461b337a6cfe50e03630f'
          RUNTIME_BRANCH = 'ops-tracka-kaggle-master-runtime-v3-fix3-e8ea268'
          expected = {
              'TRACKA_V12_MASTER_K1.ipynb': 'K1',
              'TRACKA_V12_MASTER_K2.ipynb': 'K2',
              'TRACKA_V12_MASTER_K3.ipynb': 'K3',
          }
          root = Path('journal_extension/kaggle/tracka_v12_ops')
          notebooks = {p.name: p for p in root.glob('*.ipynb')}
          if set(notebooks) != set(expected):
              raise SystemExit(f'expected exactly three master notebooks; observed={sorted(notebooks)}')
          distribution = json.loads((root/'MASTER_NOTEBOOK_DISTRIBUTION.json').read_text(encoding='utf-8'))
          if distribution.get('status') != 'LOCKED_DISTRIBUTION':
              raise SystemExit('master notebook distribution is not locked')
          if distribution.get('operator_runtime_sha') != RUNTIME_SHA:
              raise SystemExit('distribution runtime SHA mismatch')
          if distribution.get('operator_runtime_branch') != RUNTIME_BRANCH:
              raise SystemExit('distribution runtime branch mismatch')
          required_true = (
              'fail_fast_input_preflight_before_stack_install',
              'bounded_shallow_metadata_discovery',
              'nested_train_val_root_discovery',
              'resolved_input_paths_bound_for_downstream_reuse',
              'bounded_pre_science_io_retry',
          )
          for key in required_true:
              if distribution.get(key) is not True:
                  raise SystemExit(f'distribution missing required gate: {key}')
          if distribution.get('protected_test_used_for_preflight_root_resolution') is not False:
              raise SystemExit('preflight must not use protected test images for root resolution')
          for name, account in expected.items():
              nb = json.loads(notebooks[name].read_text(encoding='utf-8'))
              if nb.get('nbformat') != 4 or nb.get('nbformat_minor') != 5:
                  raise SystemExit(f'invalid notebook format: {name}')
              meta = (nb.get('metadata') or {}).get('cropcop_operator') or {}
              if meta.get('account_id') != account:
                  raise SystemExit(f'account mismatch in {name}')
              if meta.get('science_sha') != SCIENCE_SHA:
                  raise SystemExit(f'science SHA mismatch in {name}')
              if meta.get('operator_runtime_sha') != RUNTIME_SHA:
                  raise SystemExit(f'runtime SHA mismatch in {name}')
              if meta.get('operator_runtime_branch') != RUNTIME_BRANCH:
                  raise SystemExit(f'runtime branch mismatch in {name}')
              joined = json.dumps(nb)
              if RUNTIME_SHA not in joined or RUNTIME_BRANCH not in joined:
                  raise SystemExit(f'pinned runtime missing from notebook body: {name}')
              for index, cell in enumerate(nb.get('cells') or []):
                  if cell.get('cell_type') != 'code':
                      continue
                  if cell.get('execution_count') is not None or cell.get('outputs') != []:
                      raise SystemExit(f'execution residue in {name}:cell-{index}')
                  compile(''.join(cell.get('source') or []), f'{name}:cell-{index}', 'exec')
          print('three-notebook distribution syntax/binding PASS')
          PY
          git cat-file -e 'e8ea268729663a921db461b337a6cfe50e03630f^{commit}'

      - name: Compile and import master runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile journal_extension/kaggle/tracka_v12_ops/*.py
          python -m py_compile tests/test_tracka_v12_kaggle_ops.py tests/test_tracka_v12_kaggle_ops_runtime.py tests/test_tracka_v12_kaggle_master_v3.py
          python - <<'PY'
          import sys
          from pathlib import Path
          root = Path.cwd()
          for path in (root/'journal_extension/kaggle/tracka_v12_ops', root/'journal_extension/src'):
              sys.path.insert(0, str(path))
          import tracka_v12_kaggle_operator_v3
          import master_attestations
          import master_preflight
          import master_g1a
          import master_g2a
          import master_control
          import master_science
          import master_account_driver
          print('master runtime import graph PASS')
          PY

      - name: Run distribution, runtime regression and v3 failure-injection tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_tracka_v12_kaggle_ops \
            tests.test_tracka_v12_kaggle_ops_runtime \
            tests.test_tracka_v12_kaggle_master_v3

      - name: Verify packaged exact-head attestations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root/'journal_extension/kaggle/tracka_v12_ops'))
          sys.path.insert(0, str(root/'journal_extension/src'))
          from master_attestations import verified_attestation_paths
          from tracka_v12_kaggle_operator_v3 import load_json
          code, lock = verified_attestation_paths()
          c, l = load_json(code), load_json(lock)
          assert c['status'] == 'PASS' and l['status'] == 'PASS'
          assert c['github_actions'] is True and l['github_actions'] is True
          assert l['science_authorized'] is False
          print('packaged exact-head attestations PASS')
          PY

      - name: Reject tracked binary or credential artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git', 'ls-files', 'journal_extension/kaggle/tracka_v12_ops'], text=True).splitlines()
          forbidden_suffixes = ('.pt', '.pth', '.ckpt', '.pte', '.safetensors', '.zip', '.tar', '.gz', '.7z', '.env', '.key', '.pem')
          bad = [path for path in files if path.lower().endswith(forbidden_suffixes)]
          if bad:
              raise SystemExit('forbidden master-operator artifacts tracked: ' + ', '.join(bad))
          print('master-operator artifact hygiene PASS')
          PY
