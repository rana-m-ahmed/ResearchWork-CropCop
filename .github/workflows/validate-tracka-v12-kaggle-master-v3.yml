name: Validate Track-A v1.2 Kaggle master v6

on:
  push:
    branches:
      - ops-tracka-kaggle-master-v6-20260915
    paths:
      - 'journal_extension/kaggle/tracka_v12_ops/**'
      - 'tests/test_tracka_v12_kaggle_ops.py'
      - 'tests/test_tracka_v12_kaggle_ops_runtime.py'
      - 'tests/test_tracka_v12_kaggle_master_v3.py'
      - 'tests/test_tracka_v12_kaggle_publication_v4.py'
      - 'tests/test_tracka_v12_kaggle_master_v5.py'
      - 'tests/test_tracka_v12_kaggle_master_v6.py'
      - '.github/workflows/validate-tracka-v12-kaggle-master-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracka-v12-kaggle-master-v6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  master-operator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout v6 distribution branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up frozen Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'

      - name: Verify additive separation from frozen science source
        shell: bash
        run: |
          set -euo pipefail
          SCIENCE_SHA='9a72e9466a9a3e7429e0e36a028edac662f83146'
          git cat-file -e "${SCIENCE_SHA}^{commit}"
          test "$(git merge-base "$SCIENCE_SHA" HEAD)" = "$SCIENCE_SHA"
          git diff --name-status "$SCIENCE_SHA"..HEAD > /tmp/tracka_master_diff.txt
          python - <<'PY'
          from pathlib import Path
          allowed_exact = {
              '.github/workflows/validate-tracka-v12-kaggle-ops.yml',
              '.github/workflows/validate-tracka-v12-kaggle-master-v3.yml',
              'tests/test_tracka_v12_kaggle_ops.py',
              'tests/test_tracka_v12_kaggle_ops_runtime.py',
              'tests/test_tracka_v12_kaggle_master_v3.py',
              'tests/test_tracka_v12_kaggle_publication_v4.py',
              'tests/test_tracka_v12_kaggle_master_v5.py',
              'tests/test_tracka_v12_kaggle_master_v6.py',
          }
          prefix = 'journal_extension/kaggle/tracka_v12_ops/'
          rows = []
          for raw in Path('/tmp/tracka_master_diff.txt').read_text().splitlines():
              if not raw.strip():
                  continue
              status, *paths = raw.split('\t')
              rows.append(raw)
              if status != 'A':
                  raise SystemExit(f'operator branch is not additive-only: {raw}')
              for path in paths:
                  if path not in allowed_exact and not path.startswith(prefix):
                      raise SystemExit(f'non-operator path changed: {path}')
          if not rows:
              raise SystemExit('operator diff unexpectedly empty')
          print(f'additive separation PASS: {len(rows)} files')
          PY

      - name: Validate immutable v6 runtime and exact three-notebook distribution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          SCIENCE_SHA='9a72e9466a9a3e7429e0e36a028edac662f83146'
          RUNTIME_SHA='208656f895af5c218a0998b582f2adbb81167eaa'
          RUNTIME_BRANCH='ops-tracka-kaggle-master-runtime-v6-208656f'
          DRIVER='master_account_driver_v6.py'
          root=Path('journal_extension/kaggle/tracka_v12_ops')
          expected={'TRACKA_V12_MASTER_K1.ipynb':'K1','TRACKA_V12_MASTER_K2.ipynb':'K2','TRACKA_V12_MASTER_K3.ipynb':'K3'}
          observed={p.name:p for p in root.glob('*.ipynb')}
          if set(observed) != set(expected):
              raise SystemExit(f'expected exactly three notebooks; observed={sorted(observed)}')
          distribution=json.loads((root/'MASTER_NOTEBOOK_DISTRIBUTION.json').read_text())
          contract=json.loads((root/'OPERATOR_CONTRACT.json').read_text())
          freeze=json.loads((root/'MASTER_RUNTIME_FREEZE.json').read_text())
          marker=(root/'.runtime-freeze-marker').read_text()
          for payload,label in ((distribution,'distribution'),(contract,'contract')):
              if payload.get('schema_version')!='3.6' or payload.get('operator_runtime_sha')!=RUNTIME_SHA or payload.get('operator_runtime_branch')!=RUNTIME_BRANCH or payload.get('driver')!=DRIVER:
                  raise SystemExit(f'{label} v6 binding mismatch')
          if freeze.get('status')!='PASS' or freeze.get('runtime_candidate_sha')!=RUNTIME_SHA or freeze.get('runtime_branch')!=RUNTIME_BRANCH:
              raise SystemExit('freeze record mismatch')
          if not all(x in marker for x in (RUNTIME_SHA,RUNTIME_BRANCH,SCIENCE_SHA)):
              raise SystemExit('runtime marker mismatch')
          for name,account in expected.items():
              nb=json.loads(observed[name].read_text())
              meta=(nb.get('metadata') or {}).get('cropcop_operator') or {}
              if nb.get('nbformat')!=4 or nb.get('nbformat_minor')!=5:
                  raise SystemExit(f'format mismatch: {name}')
              if meta.get('schema_version')!='3.6' or meta.get('account_id')!=account or meta.get('science_sha')!=SCIENCE_SHA or meta.get('operator_runtime_sha')!=RUNTIME_SHA or meta.get('operator_runtime_branch')!=RUNTIME_BRANCH or meta.get('driver')!=DRIVER:
                  raise SystemExit(f'identity/runtime mismatch: {name}')
              body='\n'.join(''.join(c.get('source') or []) for c in nb.get('cells') or [])
              for required in (RUNTIME_SHA,RUNTIME_BRANCH,DRIVER,'CropCop_Final_v1',"V1 / 'audit' / 'final_manifest.csv'", "V1 / 'audit' / 'class_to_idx.json'", "V1 / 'dataset'", 'os.getpid()', 'uuid.uuid4()', 'Process-isolated runtime checkout'):
                  if required not in body:
                      raise SystemExit(f'missing {required!r} from {name}')
              if 'shutil.rmtree(OPS_ROOT)' in body:
                  raise SystemExit(f'shared runtime checkout deletion remains in {name}')
              if account=='K1' and 'cropcop-g1-sealed/G1_PACKAGE' not in body:
                  raise SystemExit('K1 preferred principal G1 path missing')
              for i,cell in enumerate(nb.get('cells') or []):
                  if cell.get('cell_type')=='code':
                      if cell.get('execution_count') is not None or cell.get('outputs') != []:
                          raise SystemExit(f'execution residue: {name}:cell-{i}')
                      compile(''.join(cell.get('source') or []), f'{name}:cell-{i}', 'exec')
          print('v6 three-notebook distribution PASS')
          PY
          test "$(git rev-parse refs/remotes/origin/ops-tracka-kaggle-master-runtime-v6-208656f)" = '208656f895af5c218a0998b582f2adbb81167eaa'

      - name: Compile and import v6 runtime graph
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile journal_extension/kaggle/tracka_v12_ops/*.py tests/test_tracka_v12_kaggle_*.py
          python - <<'PY'
          import sys
          from pathlib import Path
          root=Path.cwd()
          for p in (root/'journal_extension/kaggle/tracka_v12_ops',root/'journal_extension/src'):
              sys.path.insert(0,str(p))
          import master_preflight, master_verified_pretrained_v5, master_publication_v4
          import master_g1a_v6, master_singleton_v6, master_g2a, master_control, master_science_v4, master_account_driver_v6
          print('v6 import graph PASS')
          PY

      - name: Run v6 targeted remediation tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_tracka_v12_kaggle_master_v6

      - name: Run full inherited regression and distribution suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_tracka_v12_kaggle_ops \
            tests.test_tracka_v12_kaggle_ops_runtime \
            tests.test_tracka_v12_kaggle_master_v3 \
            tests.test_tracka_v12_kaggle_publication_v4 \
            tests.test_tracka_v12_kaggle_master_v5

      - name: Verify frozen-sealer compatibility and source-integrity contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import builtins, symtable
          from pathlib import Path
          root=Path.cwd()
          sealer_path=root/'journal_extension/scripts/seal_tracka_v12_g1a.py'
          source=sealer_path.read_text()
          secondary=(root/'journal_extension/src/cropcop_je/secondary.py').read_text()
          compat=(root/'journal_extension/kaggle/tracka_v12_ops/master_g1a_v6.py').read_text()
          driver=(root/'journal_extension/kaggle/tracka_v12_ops/master_account_driver_v6.py').read_text()
          table=symtable.symtable(source,str(sealer_path),'exec')
          bound={s.get_name() for s in table.get_symbols() if s.is_assigned() or s.is_imported() or s.is_namespace()}
          unresolved=set()
          def visit(scope):
              for s in scope.get_symbols():
                  if s.is_referenced() and s.is_global() and s.get_name() not in bound and s.get_name() not in dir(builtins):
                      unresolved.add(s.get_name())
              for child in scope.get_children():
                  visit(child)
          for child in table.get_children(): visit(child)
          assert unresolved == {'TORCHVISION_VERSION'}, unresolved
          assert 'TORCHVISION_VERSION = "0.27.1"' in secondary
          assert "init_globals={'TORCHVISION_VERSION': TORCHVISION_VERSION}" in compat
          assert 'FROZEN_G1A_SEALER_COMPAT' in compat
          assert driver.count('assert_clean_science_checkout(repo)') >= 5
          print('frozen-sealer + source-integrity contract PASS')
          PY

      - name: Reject tracked binary or credential artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          files=subprocess.check_output(['git','ls-files','journal_extension/kaggle/tracka_v12_ops'],text=True).splitlines()
          denied=('.pt','.pth','.ckpt','.pte','.safetensors','.zip','.tar','.gz','.7z','.env','.key','.pem')
          bad=[p for p in files if p.lower().endswith(denied)]
          if bad: raise SystemExit('forbidden artifacts: '+', '.join(bad))
          print('artifact hygiene PASS')
          PY
