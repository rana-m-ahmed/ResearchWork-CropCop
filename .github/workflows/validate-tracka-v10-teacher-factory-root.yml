name: Validate Track-A teacher factory root mitigation

on:
  push:
    branches:
      - fix/tracka-v9-teacher-factory-root-20260915
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teacher-factory-root-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up frozen Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'

      - name: Compile versioned wrapper and regression
        run: |
          python -m py_compile \
            journal_extension/scripts/run_tracka_v12_training_v121.py \
            tests/test_tracka_v12_teacher_factory_root_binding.py

      - name: Reproduce old root failure and prove corrected frozen root
        run: |
          python -m unittest -v tests.test_tracka_v12_teacher_factory_root_binding

      - name: Verify frozen teacher source byte identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path=Path('journal_extension/teacher_factory/historical_dino_tiny.py')
          observed=hashlib.sha256(path.read_bytes()).hexdigest()
          expected='5503f289a27fc65f2259745ed9ef8b1794f56329e0c19d7637b6f50d6df8258f'
          if observed != expected:
              raise SystemExit(f'historical teacher factory byte drift: {observed}')
          print('historical teacher factory exact bytes PASS', observed)
          PY

      - name: Verify narrow pre-science mitigation delta
        shell: bash
        run: |
          set -euo pipefail
          BASE='c65a5082809603155fa80a6eb0152fae33dbd9e0'
          git diff --name-only "$BASE"...HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
              '.github/workflows/validate-tracka-v10-teacher-factory-root.yml',
              'journal_extension/scripts/run_tracka_v12_training_v121.py',
              'tests/test_tracka_v12_teacher_factory_root_binding.py',
          }
          changed={x.strip() for x in Path('/tmp/changed.txt').read_text().splitlines() if x.strip()}
          if changed != allowed:
              raise SystemExit(f'unexpected teacher-root mitigation delta: {sorted(changed)}')
          print('narrow teacher-root mitigation delta PASS')
          PY

      - name: Verify no scientific configuration or protected-surface mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code c65a5082809603155fa80a6eb0152fae33dbd9e0...HEAD -- \
            journal_extension/configs \
            journal_extension/teacher_factory/historical_dino_tiny.py \
            journal_extension/src/cropcop_je/tracka_v12.py \
            journal_extension/src/cropcop_je/tracka_v12_runtime.py \
            journal_extension/src/cropcop_je/persistence_v8.py
          python - <<'PY'
          from pathlib import Path
          text=Path('journal_extension/scripts/run_tracka_v12_training_v121.py').read_text(encoding='utf-8')
          required=(
              'repo / "journal_extension" / "teacher_factory"',
              'factory_source_root=source_root',
              'tracka_runtime.load_exact_teacher = load_exact_teacher_v121',
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f'missing teacher factory root binding: {token}')
          for forbidden in ('DS-V1-TEST-CONSUMED','DS-EXT-','master_g1a_sealer_compat_v6'):
              if forbidden in text:
                  raise SystemExit(f'forbidden surface/content in mitigation: {forbidden}')
          print('scientific configuration + protected surfaces unchanged PASS')
          PY
