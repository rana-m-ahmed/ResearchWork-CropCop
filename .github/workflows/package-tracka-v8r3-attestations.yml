name: Package Track-A v8r3 attestations

on:
  workflow_dispatch:
  push:
    branches:
      - ops-tracka-kaggle-master-runtime-v8r3-4ced2fd-20260915
    paths:
      - '.github/workflows/package-tracka-v8r3-attestations.yml'

permissions:
  contents: write
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-tracka-kaggle-master-runtime-v8r3-4ced2fd-20260915
          fetch-depth: 0

      - name: Download exact-head artifacts with repository-scoped Actions token
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tracka-v8r3-attestations
          mkdir -p /tmp/tracka-v8r3-attestations/code /tmp/tracka-v8r3-attestations/lock
          gh api repos/rana-m-ahmed/ResearchWork-CropCop/actions/artifacts/10394083711/zip > /tmp/tracka-v8r3-attestations/code.zip
          gh api repos/rana-m-ahmed/ResearchWork-CropCop/actions/artifacts/10394630050/zip > /tmp/tracka-v8r3-attestations/lock.zip
          unzip -q /tmp/tracka-v8r3-attestations/code.zip -d /tmp/tracka-v8r3-attestations/code
          unzip -q /tmp/tracka-v8r3-attestations/lock.zip -d /tmp/tracka-v8r3-attestations/lock

      - name: Verify and install exact member bytes
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(find /tmp/tracka-v8r3-attestations/code -type f -name 'tracka-v12-pre-science-code-attestation.json')
          LOCK=$(find /tmp/tracka-v8r3-attestations/lock -type f -name 'tracka-v12-exact-head-lock-runtime-attestation.json')
          test -n "$CODE" && test -n "$LOCK"
          test "$(sha256sum "$CODE" | awk '{print $1}')" = '5bfb757219996aa7df48e21fd0531124c60a86f6a0c8ad17840a2a3eb88cda2e'
          test "$(sha256sum "$LOCK" | awk '{print $1}')" = '49efe43b76423c82c6849d43d3f1bea2ff24503f65564e722d205cdac2a21fea'
          python - "$CODE" "$LOCK" <<'PY'
          import json, sys
          science='4ced2fd7c764c07fa47fb57fbea38376d2ce61a4'
          for path in sys.argv[1:]:
              p=json.load(open(path, encoding='utf-8'))
              assert p['status']=='PASS'
              assert p['github_actions'] is True
              assert p['source_git_commit']==science
              assert p['pull_request_head_sha']==science
              assert p['r13_parity_contract_id']=='TRACKA-A1-R13-PRETRAINED-IDENTITY-V1.2.1'
              assert float(p['r13_parity_required_max_abs_difference'])==5e-5
          print('exact-head attestation payload identities PASS')
          PY
          OUT='journal_extension/kaggle/tracka_v12_ops/attestations_v8r3'
          mkdir -p "$OUT"
          cp "$CODE" "$OUT/tracka-v12-pre-science-code-attestation.json"
          cp "$LOCK" "$OUT/tracka-v12-exact-head-lock-runtime-attestation.json"

      - name: Commit exact packaged bytes if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal_extension/kaggle/tracka_v12_ops/attestations_v8r3/
          if git diff --cached --quiet; then
            echo 'Exact attestation bytes already packaged.'
            exit 0
          fi
          git commit -m 'Package exact-head attestations for Track-A v8r3'
          git push origin HEAD:ops-tracka-kaggle-master-runtime-v8r3-4ced2fd-20260915
