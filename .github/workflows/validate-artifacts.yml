name: Validate public evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SOURCE_SHA="$(git rev-parse HEAD)"
          printf 'expected=%s\nactual=%s\n' "$EXPECTED_SOURCE_SHA" "$ACTUAL_SOURCE_SHA"
          test "$ACTUAL_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q journal_extension scripts tests
      - name: Validate repository contract
        run: python scripts/validate_repository.py --strict --json-report validation-report.json
      - name: Validate JE static contract
        run: python scripts/validate_je.py --repo-root . --json-report je-validation-report.json
      - name: Verify MGPU science-diff sentinel and amendment hash
        run: python journal_extension/scripts/check_science_diff.py --repo-root . --json-report science-diff-report.json
      - name: Compile canonical notebook code
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("journal_extension/kaggle/canonical_lane.ipynb")
          nb = json.loads(path.read_text(encoding="utf-8"))
          for i, cell in enumerate(nb.get("cells", [])):
              if cell.get("cell_type") == "code":
                  source = "".join(cell.get("source", []))
                  compile(source, f"{path.name}:cell-{i}", "exec")
          PY
      - name: Verify canonical notebook matches generator output
        shell: bash
        run: |
          set -euo pipefail
          cp journal_extension/kaggle/canonical_lane.ipynb /tmp/canonical_lane.before.ipynb
          python journal_extension/kaggle/generate_canonical_notebook.py
          diff -u /tmp/canonical_lane.before.ipynb journal_extension/kaggle/canonical_lane.ipynb
          git diff --exit-code -- journal_extension/kaggle/canonical_lane.ipynb
      - name: Verify tracked tree has no forbidden model artifacts
        run: |
          python - <<'PY'
          import re, subprocess
          forbidden = re.compile(r"\.(?:pt|pth|ckpt|pte|safetensors)$", re.I)
          offenders = [p for p in subprocess.check_output(["git", "ls-files"], text=True).splitlines() if forbidden.search(p)]
          if offenders:
              raise SystemExit("forbidden tracked model/checkpoint artifacts: " + repr(offenders))
          PY
      - name: Scan tracked text for live-looking GitHub secrets
        run: |
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          patterns = [
              re.compile(r"gh[pousr]_[A-Za-z0-9_]{30,}"),
              re.compile(r"github_pat_[A-Za-z0-9_]{30,}"),
          ]
          # Exact fake credential fixture required by the publication failure-injection test.
          allowed_fixtures = {
              ("tests/test_je_failure_injection_matrix.py", "github_" + "pat_abcdefghijklmnopqrstuvwxyz123456"),
          }
          offenders = []
          for rel in subprocess.check_output(["git", "ls-files"], text=True).splitlines():
              p = Path(rel)
              if not p.is_file():
                  continue
              try:
                  value = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for pattern in patterns:
                  for match in pattern.finditer(value):
                      if (rel, match.group(0)) not in allowed_fixtures:
                          offenders.append((rel, match.group(0)[:12] + "...", pattern.pattern))
          if offenders:
              raise SystemExit("live-looking GitHub credential pattern in tracked tree: " + repr(offenders))
          PY
      - name: Validate active QA1 operator documentation
        run: python journal_extension/scripts/validate_operator_docs.py --repo-root . --json-report operator-docs-report.json
      - name: Run QA1 Wave-A contract tests
        run: python -m unittest discover -s tests -p 'test_je_qa1_wave_a.py' -v
      - name: Run QA1 Wave-B recovery tests
        run: python -m unittest discover -s tests -p 'test_je_qa1_wave_b.py' -v
      - name: Run QA1 Wave-C durability tests
        run: python -m unittest discover -s tests -p 'test_je_qa1_wave_c.py' -v
      - name: Run MGPU dual-envelope contract tests
        run: python -m unittest discover -s tests -p 'test_je_mgpu_envelope.py' -v
      - name: Run complete CPU-safe test suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest-report.txt
      - name: Record exact-head CI context
        if: always()
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          checked_out = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          Path("ci-verification.json").write_text(json.dumps({
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
              "workflow_context_sha": os.environ.get("GITHUB_SHA"),
              "expected_source_sha": os.environ.get("EXPECTED_SOURCE_SHA"),
              "checked_out_source_sha": checked_out,
              "exact_source_sha_match": checked_out == os.environ.get("EXPECTED_SOURCE_SHA"),
              "ref": os.environ.get("GITHUB_REF"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "tests_step_reached_artifact_stage": True
          }, indent=2, sort_keys=True) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: |
            validation-report.json
            je-validation-report.json
            science-diff-report.json
            operator-docs-report.json
            unittest-report.txt
            ci-verification.json

  g1p-transformers-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install exact G1P Transformers candidate matrix
        run: |
          python -m pip install --disable-pip-version-check --no-input torch==2.12.1 torchvision==0.27.1 timm==1.0.26 numpy==2.5.2 Pillow==12.3.0 safetensors==0.8.0 kaggle==2.2.4 huggingface-hub==1.30.0 transformers==5.0.0
          python -m pip check
      - name: Verify exact Kaggle 2.2.4 publication API contract
        run: python journal_extension/scripts/check_kaggle_2_2_4_contract.py
      - name: Verify offline DINOv3 ConvNeXt candidate compatibility
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python journal_extension/scripts/check_transformers_candidate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transformers-candidate-report
          path: |
            transformers-candidate-report.json
            kaggle-api-contract-report.json
