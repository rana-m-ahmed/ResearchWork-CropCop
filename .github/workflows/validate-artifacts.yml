name: Validate public evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository contract
        run: python scripts/validate_repository.py --strict --json-report validation-report.json
      - name: Validate JE static contract
        run: python scripts/validate_je.py --repo-root . --json-report je-validation-report.json
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: |
            validation-report.json
            je-validation-report.json
