name: Validate public evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q journal_extension scripts tests
      - name: Validate repository contract
        run: python scripts/validate_repository.py --strict --json-report validation-report.json
      - name: Validate JE static contract
        run: python scripts/validate_je.py --repo-root . --json-report je-validation-report.json
      - name: Run complete CPU-safe test suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unittest-report.txt
      - name: Record exact-head CI context
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("ci-verification.json").write_text(json.dumps({
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
              "sha": os.environ.get("GITHUB_SHA"),
              "ref": os.environ.get("GITHUB_REF"),
              "event": os.environ.get("GITHUB_EVENT_NAME"),
              "tests_step_reached_artifact_stage": True
          }, indent=2, sort_keys=True) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: |
            validation-report.json
            je-validation-report.json
            unittest-report.txt
            ci-verification.json
