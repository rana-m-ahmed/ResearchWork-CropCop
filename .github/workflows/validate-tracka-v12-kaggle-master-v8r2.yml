name: Validate Track-A v1.2 Kaggle master v8.2

on:
  push:
    branches:
      - ops-tracka-kaggle-master-runtime-v8r2-4ced2fd-20260915
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  v8r2-release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact v8.2 runtime candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up frozen Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'

      - name: Verify final qualified science source and executable consumers
        shell: bash
        run: |
          set -euo pipefail
          SCIENCE='4ced2fd7c764c07fa47fb57fbea38376d2ce61a4'
          git fetch --quiet origin "$SCIENCE"
          git cat-file -e "$SCIENCE^{commit}"
          grep -F "SCIENCE_SHA_V8 = \"$SCIENCE\"" journal_extension/kaggle/tracka_v12_ops/tracka_v12_kaggle_operator_v8.py
          for path in \
            journal_extension/scripts/seal_tracka_v12_g1a_v121.py \
            journal_extension/kaggle/run_tracka_v12_account_v121.py \
            journal_extension/scripts/seal_tracka_v12_science_go_v124.py \
            journal_extension/scripts/run_tracka_v12_training_v121.py; do
            git cat-file -e "$SCIENCE:$path"
          done
          git show "$SCIENCE:journal_extension/kaggle/run_tracka_v12_account_v121.py" | grep -F 'base.load_and_validate_g1a_bundle = load_and_validate_g1a_bundle_v121'
          git show "$SCIENCE:journal_extension/scripts/seal_tracka_v12_science_go_v124.py" | grep -F 'legacy.validate_g1a_seal_object = validate_g1a_seal_object_v121'
          git show "$SCIENCE:journal_extension/scripts/seal_tracka_v12_science_go_v124.py" | grep -F 'payload.get("schema_version") != "1.1"'

      - name: Compile and run executable-route regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            journal_extension/kaggle/tracka_v12_ops/tracka_v12_kaggle_operator_v8.py \
            journal_extension/kaggle/tracka_v12_ops/master_attestations_v8.py \
            journal_extension/kaggle/tracka_v12_ops/master_wait_v8.py \
            journal_extension/kaggle/tracka_v12_ops/master_g1a_v8.py \
            journal_extension/kaggle/tracka_v12_ops/master_g2a_v8.py \
            journal_extension/kaggle/tracka_v12_ops/master_control_v8.py \
            journal_extension/kaggle/tracka_v12_ops/master_publication_v8.py \
            journal_extension/kaggle/tracka_v12_ops/master_science_v8.py \
            journal_extension/kaggle/tracka_v12_ops/master_account_driver_v8.py \
            journal_extension/kaggle/tracka_v12_ops/master_launch_guard_v8.py \
            tests/test_tracka_v12_kaggle_master_v8r2.py
          python -m unittest -v \
            tests.test_tracka_v12_kaggle_ops_runtime \
            tests.test_tracka_v12_kaggle_master_v5 \
            tests.test_tracka_v12_kaggle_publication_v8 \
            tests.test_tracka_v12_kaggle_master_v8r2

      - name: Independently download and verify exact-head GitHub Actions attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cropcop-code /tmp/cropcop-lock
          gh run download 34963401988 -n tracka-v12-implementation-qa -D /tmp/cropcop-code
          gh run download 34963401653 -n tracka-v12-exact-head-lock-runtime-attestation -D /tmp/cropcop-lock
          CODE=/tmp/cropcop-code/tracka-v12-pre-science-code-attestation.json
          LOCK=/tmp/cropcop-lock/tracka-v12-exact-head-lock-runtime-attestation.json
          test "$(sha256sum "$CODE" | awk '{print $1}')" = '5bfb757219996aa7df48e21fd0531124c60a86f6a0c8ad17840a2a3eb88cda2e'
          test "$(sha256sum "$LOCK" | awk '{print $1}')" = '49efe43b76423c82c6849d43d3f1bea2ff24503f65564e722d205cdac2a21fea'
          python - <<'PY'
          import json
          from pathlib import Path
          science='4ced2fd7c764c07fa47fb57fbea38376d2ce61a4'
          code=json.loads(Path('/tmp/cropcop-code/tracka-v12-pre-science-code-attestation.json').read_text())
          lock=json.loads(Path('/tmp/cropcop-lock/tracka-v12-exact-head-lock-runtime-attestation.json').read_text())
          for label,p in [('code',code),('lock',lock)]:
              assert p['status']=='PASS', (label,p.get('status'))
              assert p['github_actions'] is True
              assert p['source_git_commit']==science
              assert p['pull_request_head_sha']==science
              assert p['schema_version']=='1.1'
              assert p['r13_parity_contract_id']=='TRACKA-A1-R13-PRETRAINED-IDENTITY-V1.2.1'
              assert float(p['r13_parity_required_max_abs_difference'])==5e-5
          impl=code['implementation_sha256']
          for path in (
              'journal_extension/scripts/seal_tracka_v12_g1a_v121.py',
              'journal_extension/kaggle/run_tracka_v12_account_v121.py',
              'journal_extension/scripts/seal_tracka_v12_science_go_v124.py',
              'journal_extension/scripts/run_tracka_v12_training_v121.py',
          ):
              assert len(impl.get(path,''))==64, path
          for gate in ('kaggle_generation_durability_contract','g1a_runtime_global_resolution_contract','r13_parity_amendment_contract'):
              assert code['static_pre_science_gates'][gate]=='PASS'
          assert lock['science_authorized'] is False
          assert lock['r13_exact_pretrained_parity']=='PASS'
          assert lock['r13_v121_parity_amendment']=='PASS'
          exact=lock['exact_pretrained_parity_report']
          assert exact['v1_2_1_gate_pass'] is True
          assert exact['historical_v1_2_gate_pass'] is False
          assert exact['scientific_metric_computed'] is False
          assert exact['v1_test_accessed'] is False
          PY
          gh api repos/rana-m-ahmed/ResearchWork-CropCop/actions/artifacts/10394083711 --jq '.expired == false and .workflow_run.head_sha == "4ced2fd7c764c07fa47fb57fbea38376d2ce61a4"' | grep -Fx true
          gh api repos/rana-m-ahmed/ResearchWork-CropCop/actions/artifacts/10394630050 --jq '.expired == false and .workflow_run.head_sha == "4ced2fd7c764c07fa47fb57fbea38376d2ce61a4"' | grep -Fx true

      - name: Verify frozen release manifest
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=journal_extension/kaggle/tracka_v12_ops/attestations_v8r2/RELEASE_ATTESTATION_MANIFEST.json
          test "$(sha256sum "$MANIFEST" | awk '{print $1}')" = 'a89ad7368eaf6f685087cffe4e428dfb5295d0909dc60d448b871946f3e2b61f'
          python - <<'PY'
          import json
          from pathlib import Path
          ops=Path('journal_extension/kaggle/tracka_v12_ops')
          m=json.loads((ops/'attestations_v8r2/RELEASE_ATTESTATION_MANIFEST.json').read_text())
          assert m['science_source_sha']=='4ced2fd7c764c07fa47fb57fbea38376d2ce61a4'
          assert m['remaining_scientific_states']==11
          assert m['science_authorized'] is False
          assert m['protected_test_accessed'] is False
          assert m['external_surface_accessed'] is False
          assert m['code_attestation']['artifact_id']==10394083711
          assert m['lock_runtime_attestation']['artifact_id']==10394630050
          driver=(ops/'master_account_driver_v8.py').read_text()
          call=driver.index('lambda: materialize_verified_attestations')
          assert driver.index('stage("SCIENCE_SOURCE_GITHUB_AND_ATTESTATION_PREFLIGHT"') < call
          assert call < driver.index('stage("EXACT_EXECUTION_STACK"')
          assert driver.index('stage("EXACT_EXECUTION_STACK"') < driver.index('stage("CANONICAL_G1A"')
          PY
