name: Bootstrap audit-closure tree

on:
  push:
    branches: [audit-closure-v0.2.0]
    paths: [".sync_payload/part-04.txt"]

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor == 'rana-m-ahmed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Decode validated repository tree
        shell: bash
        run: |
          set -euo pipefail
          cat .sync_payload/part-*.txt | tr -d '\n' | base64 --decode > /tmp/cropcop-audit-closure.tar.xz
          echo "2f1a0e5dabf42608b21233442729ae5e316ad14abdab1587149d852df137c77e  /tmp/cropcop-audit-closure.tar.xz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/cropcop-audit-closure.tar.xz -C .
      - name: Commit synchronized closure candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rana Muhammad Ahmed"
          git config user.email "ranamuhammadahmed6@gmail.com"
          git add -A
          git commit -m "release: synchronize forensic-audit closure candidate"
          git push origin HEAD:audit-closure-v0.2.0
