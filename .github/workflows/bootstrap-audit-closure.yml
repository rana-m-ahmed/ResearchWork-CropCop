name: Bootstrap audit-closure tree

on:
  push:
    branches: [audit-closure-v0.2.0]
    paths: [".sync_payload/part-09.txt"]

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor == 'rana-m-ahmed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Decode validated repository tree
        shell: bash
        run: |
          set -euo pipefail
          cat .sync_payload/part-*.txt | tr -d '\n' | base64 --decode > /tmp/cropcop-audit-closure.tar.xz
          echo "7c0d18a4aca938b56fc58b34b346ac335bdb011eb76d3b9105fca4830628bfd7  /tmp/cropcop-audit-closure.tar.xz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/cropcop-audit-closure.tar.xz -C .
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-extra texlive-science poppler-utils
          python -m pip install pandas==2.2.3 numpy==2.1.3 matplotlib==3.9.2 PyYAML==6.0.2 pypdf==5.9.0
      - name: Regenerate public artifacts and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_publication_figures.py
          bash scripts/build_paper.sh
          git add -A
          python scripts/generate_repository_manifest.py
          python scripts/generate_checksums.py
          git add -A
          python scripts/check_markdown_links.py
          python -m unittest discover -s tests -v
          python scripts/validate_repository.py --strict
          sha256sum -c SHA256SUMS.txt
          sha256sum -c evidence/public/SHA256SUMS.txt
          python scripts/check_deterministic_pdf.py
      - name: Commit synchronized closure candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Rana Muhammad Ahmed"
          git config user.email "ranamuhammadahmed6@gmail.com"
          git add -A
          git commit -m "release: synchronize forensic-audit closure candidate"
          git push origin HEAD:audit-closure-v0.2.0
