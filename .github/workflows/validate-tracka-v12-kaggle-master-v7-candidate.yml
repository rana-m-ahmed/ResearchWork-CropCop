name: Validate Track-A v1.2 Kaggle master v7 candidate

on:
  push:
    branches:
      - ops-tracka-kaggle-master-runtime-v7-e21a505
    paths:
      - 'journal_extension/kaggle/tracka_v12_ops/tracka_v12_kaggle_operator.py'
      - 'journal_extension/kaggle/tracka_v12_ops/tracka_v12_kaggle_operator_v3.py'
      - 'journal_extension/kaggle/tracka_v12_ops/attestations/**'
      - 'journal_extension/kaggle/tracka_v12_ops/master_attestations.py'
      - 'journal_extension/kaggle/tracka_v12_ops/master_g1a_v7.py'
      - 'journal_extension/kaggle/tracka_v12_ops/master_g2a_v7.py'
      - 'journal_extension/kaggle/tracka_v12_ops/master_launch_guard_v7.py'
      - 'journal_extension/kaggle/tracka_v12_ops/master_account_driver_v7.py'
      - 'tests/test_tracka_v12_kaggle_master_v7.py'
      - '.github/workflows/validate-tracka-v12-kaggle-master-v7-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v7-remediation-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1c
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up frozen Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'

      - name: Verify repaired science binding
        shell: bash
        run: |
          set -euo pipefail
          SCIENCE_SHA='e21a505792ddd91df55712e248391c79c55cf235'
          git fetch --quiet origin "$SCIENCE_SHA"
          git cat-file -e "$SCIENCE_SHA^{commit}"
          grep -F "SCIENCE_SHA = \"$SCIENCE_SHA\"" journal_extension/kaggle/tracka_v12_ops/tracka_v12_kaggle_operator.py
          git show "$SCIENCE_SHA:journal_extension/scripts/seal_tracka_v12_g1a.py" | grep -F 'TORCHVISION_VERSION,'
          echo 'repaired pinned science binding PASS'

      - name: Compile v7 remediation modules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            journal_extension/kaggle/tracka_v12_ops/master_attestations.py \
            journal_extension/kaggle/tracka_v12_ops/master_g1a_v7.py \
            journal_extension/kaggle/tracka_v12_ops/master_g2a_v7.py \
            journal_extension/kaggle/tracka_v12_ops/master_launch_guard_v7.py \
            journal_extension/kaggle/tracka_v12_ops/master_account_driver_v7.py \
            tests/test_tracka_v12_kaggle_master_v7.py

      - name: Run operator regression suite plus v7 failure injection
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            tests.test_tracka_v12_kaggle_ops \
            tests.test_tracka_v12_kaggle_ops_runtime \
            tests.test_tracka_v12_kaggle_master_v3 \
            tests.test_tracka_v12_kaggle_publication_v4 \
            tests.test_tracka_v12_kaggle_master_v5 \
            tests.test_tracka_v12_kaggle_master_v7

      - name: Verify v7 source hygiene and direct source execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('journal_extension/kaggle/tracka_v12_ops')
          files=[
              root/'master_launch_guard_v7.py',
              root/'master_account_driver_v7.py',
              root/'master_g1a_v7.py',
              root/'master_g2a_v7.py',
          ]
          text='\n'.join(p.read_text(encoding='utf-8') for p in files)
          for forbidden in ('github_pat_','ghp_','DS-V1-TEST-CONSUMED','master_g1a_sealer_compat_v6','init_globals','runpy.run_path'):
              if forbidden in text:
                  raise SystemExit(f'forbidden v7 source content: {forbidden}')
          driver=(root/'master_account_driver_v7.py').read_text(encoding='utf-8')
          if 'from master_g1a_v7 import' not in driver or 'from master_g2a_v7 import' not in driver:
              raise SystemExit('v7 driver is not bound to the fail-fast canonical G1A/G2A paths')
          g1a=(root/'master_g1a_v7.py').read_text(encoding='utf-8')
          if 'seal_tracka_v12_g1a.py' not in g1a:
              raise SystemExit('v7 G1A wrapper does not execute the canonical scientific sealer directly')
          print('v7 source hygiene + direct repaired-source execution PASS')
          PY
