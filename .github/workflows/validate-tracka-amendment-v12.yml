name: Validate Track-A amendment v1.2

on:
  pull_request:
    paths:
      - '03B_2_TRACK_A_STRENGTHENING_AMENDMENT_v1_2_MODERN_VIT_SUPPLEMENT.md'
      - 'journal_extension/TRACK_A_V12_EXECUTION_RUNBOOK.md'
      - 'journal_extension/amendments/track_a_strengthening_v1/**'
      - 'journal_extension/configs/r06_effb0/**'
      - 'journal_extension/configs/r07_cnxtt/**'
      - 'journal_extension/configs/r12_logits/**'
      - 'journal_extension/configs/r12_feature/**'
      - 'journal_extension/configs/r13_vit_dlittle/**'
      - 'journal_extension/locks/track_a_comprehensive_execution_authority_v1_2_1.json'
      - 'journal_extension/src/cropcop_je/checkpointing.py'
      - 'journal_extension/src/cropcop_je/persistence.py'
      - 'journal_extension/src/cropcop_je/tracka_v12*.py'
      - 'journal_extension/src/cropcop_je/secondary.py'
      - 'journal_extension/scripts/*tracka_v12*.py'
      - 'journal_extension/kaggle/run_tracka_v12_account.py'
      - 'tests/test_tracka_v12*.py'
      - '.github/workflows/validate-tracka-amendment-v12.yml'
      - '.github/workflows/validate-tracka-v12-implementation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Verify exact checked-out head
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Validate immutable historical v1.2 content lock
        run: |
          python journal_extension/amendments/track_a_strengthening_v1/validate_v1_2_lock.py \
            --report tracka-amendment-v12-content-report.json
      - name: Validate pre-science R13 parity v1.2.1 amendment lock
        run: |
          python journal_extension/amendments/track_a_strengthening_v1/validate_r13_parity_amendment_v1_2_1.py \
            --report r13-parity-amendment-v121-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracka-amendment-v12-content-report
          path: tracka-amendment-v12-content-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r13-parity-amendment-v121-report
          path: r13-parity-amendment-v121-report.json

  r13-runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out head
        shell: bash
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install exact frozen training stack
        run: |
          python -m pip install --disable-pip-version-check --no-input -r journal_extension/requirements-training.lock.txt
          python -m pip check
      - name: Probe exact R13 architecture interface before scientific outputs
        run: |
          python journal_extension/amendments/track_a_strengthening_v1/probe_r13_interface.py \
            --report r13-interface-probe.json
      - name: Validate sealed R13 v1.2.1 architecture/runtime interface
        run: |
          python journal_extension/amendments/track_a_strengthening_v1/validate_v1_2_1_runtime.py \
            --report tracka-amendment-v121-runtime-report.json
      - name: Download and verify exact pinned R13 pretrained artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://huggingface.co/timm/vit_dlittle_patch16_reg1_gap_256.sbb_nadamuon_in1k/resolve/10143029df1b2df4c63623de6b740ecccb2b8ea2/model.safetensors?download=true' \
            --output r13-exact-pretrained.safetensors
          test "$(stat -c %s r13-exact-pretrained.safetensors)" = '90095744'
          test "$(sha256sum r13-exact-pretrained.safetensors | awk '{print $1}')" = '92ec2d996329be8c9a449d4e38f847e79c34fadc32b6491739bacdaf425ab0ed'
      - name: Validate exact pretrained normalization parity under superseding v1.2.1 gate
        run: |
          python journal_extension/amendments/track_a_strengthening_v1/validate_r13_pretrained_parity_v1_2_1.py \
            --pretrained r13-exact-pretrained.safetensors \
            --report r13-exact-pretrained-parity-v121-report.json
      - name: Validate exact-stack robustness and Grad-CAM++ runtime semantics
        run: python -m unittest tests.test_tracka_v12_runtime_analysis -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r13-interface-probe
          path: r13-interface-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracka-amendment-v121-runtime-report
          path: tracka-amendment-v121-runtime-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r13-exact-pretrained-parity-v121-report
          path: r13-exact-pretrained-parity-v121-report.json

  exact-head-lock-runtime-attestation:
    needs: [content-lock, r13-runtime-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: actions/download-artifact@v4
        with:
          name: tracka-amendment-v12-content-report
          path: attestation-inputs/content
      - uses: actions/download-artifact@v4
        with:
          name: tracka-amendment-v121-runtime-report
          path: attestation-inputs/runtime
      - uses: actions/download-artifact@v4
        with:
          name: r13-parity-amendment-v121-report
          path: attestation-inputs/parity-amendment
      - uses: actions/download-artifact@v4
        with:
          name: r13-exact-pretrained-parity-v121-report
          path: attestation-inputs/exact-pretrained-parity
      - name: Bind immutable lock, parity amendment and exact-pretrained proof to exact PR head
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python journal_extension/scripts/build_tracka_v12_lock_runtime_attestation.py \
            --repo-root . \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --content-lock-report attestation-inputs/content/tracka-amendment-v12-content-report.json \
            --runtime-report attestation-inputs/runtime/tracka-amendment-v121-runtime-report.json \
            --parity-amendment-report attestation-inputs/parity-amendment/r13-parity-amendment-v121-report.json \
            --exact-pretrained-parity-report attestation-inputs/exact-pretrained-parity/r13-exact-pretrained-parity-v121-report.json \
            --output tracka-v12-exact-head-lock-runtime-attestation.json
      - uses: actions/upload-artifact@v4
        with:
          name: tracka-v12-exact-head-lock-runtime-attestation
          path: tracka-v12-exact-head-lock-runtime-attestation.json
