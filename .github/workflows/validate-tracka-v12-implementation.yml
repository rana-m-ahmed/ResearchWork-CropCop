name: Validate Track-A v1.2 implementation

on:
  pull_request:
    paths:
      - 'journal_extension/configs/r06_effb0/**'
      - 'journal_extension/configs/r07_cnxtt/**'
      - 'journal_extension/configs/r12_logits/**'
      - 'journal_extension/configs/r12_feature/**'
      - 'journal_extension/configs/r13_vit_dlittle/**'
      - 'journal_extension/src/cropcop_je/tracka_v12.py'
      - 'journal_extension/src/cropcop_je/tracka_v12_g1a.py'
      - 'journal_extension/locks/track_a_comprehensive_execution_authority_v1_2_1.json'
      - 'tests/test_tracka_v12_contract.py'
      - 'tests/test_tracka_v12_g1a_contract.py'
      - '.github/workflows/validate-tracka-v12-implementation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-science-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Compile additive Track-A v1.2 contracts
        run: |
          python -m compileall -q \
            journal_extension/src/cropcop_je/tracka_v12.py \
            journal_extension/src/cropcop_je/tracka_v12_g1a.py \
            tests/test_tracka_v12_contract.py \
            tests/test_tracka_v12_g1a_contract.py
      - name: Validate frozen continuation configs and G1A failure injection
        run: |
          python -m unittest \
            tests.test_tracka_v12_contract \
            tests.test_tracka_v12_g1a_contract \
            -v
      - name: Prove original principal science semantics remain unchanged
        run: python journal_extension/scripts/check_science_diff.py --repo-root . --json-report principal-science-diff-tracka-v12.json
      - name: Prove completed secondary-wave science boundary remains unchanged
        run: python journal_extension/scripts/check_secondary_science_diff.py --repo-root . --output secondary-science-diff-tracka-v12.json
      - name: Reject tracked model, checkpoint, archive and secret files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess
          forbidden = re.compile(r"\.(?:pt|pth|ckpt|pte|safetensors|zip|tar|gz|7z|env)$", re.I)
          offenders = [p for p in subprocess.check_output(["git", "ls-files"], text=True).splitlines() if forbidden.search(p)]
          if offenders:
              raise SystemExit("forbidden tracked binary/secret artifacts: " + repr(offenders))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracka-v12-implementation-qa
          path: |
            principal-science-diff-tracka-v12.json
            secondary-science-diff-tracka-v12.json
