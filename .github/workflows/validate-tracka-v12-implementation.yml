name: Validate Track-A v1.2 implementation

on:
  pull_request:
    paths:
      - 'journal_extension/TRACK_A_V12_EXECUTION_RUNBOOK.md'
      - 'journal_extension/configs/r06_effb0/**'
      - 'journal_extension/configs/r07_cnxtt/**'
      - 'journal_extension/configs/r12_logits/**'
      - 'journal_extension/configs/r12_feature/**'
      - 'journal_extension/configs/r13_vit_dlittle/**'
      - 'journal_extension/src/cropcop_je/tracka_v12*.py'
      - 'journal_extension/src/cropcop_je/secondary.py'
      - 'journal_extension/scripts/seal_tracka_v12_g1a.py'
      - 'journal_extension/scripts/run_tracka_v12_training.py'
      - 'journal_extension/scripts/run_tracka_v12_training_v121.py'
      - 'journal_extension/scripts/qualify_tracka_v12_profile.py'
      - 'journal_extension/scripts/qualify_tracka_v12_profile_v121.py'
      - 'journal_extension/scripts/qualify_tracka_v12_profile_v122.py'
      - 'journal_extension/scripts/seal_tracka_v12_g2a.py'
      - 'journal_extension/scripts/run_tracka_v12_direct_evidence.py'
      - 'journal_extension/scripts/run_tracka_v12_auxiliary_evidence.py'
      - 'journal_extension/scripts/run_tracka_v12_xai.py'
      - 'journal_extension/scripts/seal_tracka_v12_selection.py'
      - 'journal_extension/scripts/seal_tracka_v12_auxiliary_analysis.py'
      - 'journal_extension/scripts/seal_tracka_v12_comprehensive_closure.py'
      - 'journal_extension/scripts/build_tracka_v12_code_attestation.py'
      - 'journal_extension/scripts/build_tracka_v12_lock_runtime_attestation.py'
      - 'journal_extension/scripts/seal_tracka_v12_science_go.py'
      - 'journal_extension/kaggle/run_tracka_v12_account.py'
      - 'journal_extension/locks/track_a_comprehensive_execution_authority_v1_2_1.json'
      - 'journal_extension/amendments/track_a_strengthening_v1/model_selection_operationalization_v1_2_1.json'
      - 'journal_extension/amendments/track_a_strengthening_v1/parallel_execution_plan_v1_2_1.json'
      - 'journal_extension/amendments/track_a_strengthening_v1/parallel_execution_plan_v1_2_2.json'
      - 'journal_extension/amendments/track_a_strengthening_v1/candidate_comparison_claim_boundary_v1_2_1.json'
      - 'journal_extension/amendments/track_a_strengthening_v1/xai_operationalization_v1_2_2.json'
      - 'tests/test_tracka_v12*.py'
      - '.github/workflows/validate-tracka-amendment-v12.yml'
      - '.github/workflows/validate-tracka-v12-implementation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-science-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checked-out source SHA
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Compile complete pre-science Track-A implementation
        run: |
          python -m compileall -q \
            journal_extension/src/cropcop_je/secondary.py \
            journal_extension/src/cropcop_je/tracka_v12.py \
            journal_extension/src/cropcop_je/tracka_v12_g1a.py \
            journal_extension/src/cropcop_je/tracka_v12_g2a.py \
            journal_extension/src/cropcop_je/tracka_v12_g2a_v122.py \
            journal_extension/src/cropcop_je/tracka_v12_analysis.py \
            journal_extension/src/cropcop_je/tracka_v12_runtime.py \
            journal_extension/src/cropcop_je/tracka_v12_authorization.py \
            journal_extension/src/cropcop_je/tracka_v12_placement.py \
            journal_extension/src/cropcop_je/tracka_v12_orchestration.py \
            journal_extension/src/cropcop_je/tracka_v12_evidence.py \
            journal_extension/src/cropcop_je/tracka_v12_historical.py \
            journal_extension/src/cropcop_je/tracka_v12_posttraining.py \
            journal_extension/src/cropcop_je/tracka_v12_xai.py \
            journal_extension/scripts/seal_tracka_v12_g1a.py \
            journal_extension/scripts/run_tracka_v12_training.py \
            journal_extension/scripts/run_tracka_v12_training_v121.py \
            journal_extension/scripts/qualify_tracka_v12_profile.py \
            journal_extension/scripts/qualify_tracka_v12_profile_v121.py \
            journal_extension/scripts/qualify_tracka_v12_profile_v122.py \
            journal_extension/scripts/seal_tracka_v12_g2a.py \
            journal_extension/scripts/run_tracka_v12_direct_evidence.py \
            journal_extension/scripts/run_tracka_v12_auxiliary_evidence.py \
            journal_extension/scripts/run_tracka_v12_xai.py \
            journal_extension/scripts/seal_tracka_v12_selection.py \
            journal_extension/scripts/seal_tracka_v12_auxiliary_analysis.py \
            journal_extension/scripts/seal_tracka_v12_comprehensive_closure.py \
            journal_extension/scripts/build_tracka_v12_code_attestation.py \
            journal_extension/scripts/build_tracka_v12_lock_runtime_attestation.py \
            journal_extension/scripts/seal_tracka_v12_science_go.py \
            journal_extension/kaggle/run_tracka_v12_account.py \
            tests/test_tracka_v12_contract.py \
            tests/test_tracka_v12_g1a_contract.py \
            tests/test_tracka_v12_g2a.py \
            tests/test_tracka_v12_g2a_v122.py \
            tests/test_tracka_v12_analysis.py \
            tests/test_tracka_v12_authorization.py \
            tests/test_tracka_v12_placement.py \
            tests/test_tracka_v12_orchestration.py \
            tests/test_tracka_v12_evidence.py \
            tests/test_tracka_v12_historical.py \
            tests/test_tracka_v12_science_go.py \
            tests/test_tracka_v12_comprehensive_closure.py
      - name: Validate contracts, failure injection, orchestration, evidence and closure composition
        run: |
          python -m unittest \
            tests.test_tracka_v12_contract \
            tests.test_tracka_v12_g1a_contract \
            tests.test_tracka_v12_g2a \
            tests.test_tracka_v12_g2a_v122 \
            tests.test_tracka_v12_analysis \
            tests.test_tracka_v12_authorization \
            tests.test_tracka_v12_placement \
            tests.test_tracka_v12_orchestration \
            tests.test_tracka_v12_evidence \
            tests.test_tracka_v12_historical \
            tests.test_tracka_v12_science_go \
            tests.test_tracka_v12_comprehensive_closure \
            -v
      - name: Prove original principal science semantics remain unchanged
        run: python journal_extension/scripts/check_science_diff.py --repo-root . --json-report principal-science-diff-tracka-v12.json
      - name: Prove completed secondary-wave science boundary remains unchanged
        run: python journal_extension/scripts/check_secondary_science_diff.py --repo-root . --output secondary-science-diff-tracka-v12.json
      - name: Reject tracked model, checkpoint, archive and secret files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess
          forbidden = re.compile(r"\.(?:pt|pth|ckpt|pte|safetensors|zip|tar|gz|7z|env)$", re.I)
          offenders = [p for p in subprocess.check_output(["git", "ls-files"], text=True).splitlines() if forbidden.search(p)]
          if offenders:
              raise SystemExit("forbidden tracked binary/secret artifacts: " + repr(offenders))
          PY
      - name: Emit exact-head pre-science code attestation
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python journal_extension/scripts/build_tracka_v12_code_attestation.py \
            --repo-root . \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --principal-science-diff principal-science-diff-tracka-v12.json \
            --secondary-science-diff secondary-science-diff-tracka-v12.json \
            --output tracka-v12-pre-science-code-attestation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracka-v12-implementation-qa
          path: |
            principal-science-diff-tracka-v12.json
            secondary-science-diff-tracka-v12.json
            tracka-v12-pre-science-code-attestation.json
