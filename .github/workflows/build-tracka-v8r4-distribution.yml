name: Build Track-A v8r4 distribution

on:
  push:
    branches: [ops-tracka-kaggle-master-v8r4-distribution-20260915]
    paths: ['.github/workflows/build-tracka-v8r4-distribution.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-tracka-kaggle-master-v8r4-distribution-20260915
          fetch-depth: 0
      - name: Verify frozen runtime target
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git ls-remote origin refs/heads/ops-tracka-kaggle-master-runtime-v8r4-99ae5f3 | awk '{print $1}')"
          test "$observed" = '99ae5f340bdea1142c8b4e9289956e4387fd494a'
      - name: Generate v8r4 notebooks and manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('journal_extension/kaggle/tracka_v12_ops')
          science='4ced2fd7c764c07fa47fb57fbea38376d2ce61a4'
          runtime='99ae5f340bdea1142c8b4e9289956e4387fd494a'
          branch='ops-tracka-kaggle-master-runtime-v8r4-99ae5f3'
          paths={}
          for account in ('K1','K2','K3'):
              p=root/f'TRACKA_V12_MASTER_{account}.ipynb'
              nb=json.loads(p.read_text(encoding='utf-8'))
              full=json.dumps(nb)
              full=full.replace('v8.3','v8.4')
              full=full.replace('424e331711498b6e0f769a2afe525ae8d9008d2b',runtime)
              full=full.replace('ops-tracka-kaggle-master-runtime-v8r3-424e331',branch)
              full=full.replace('/kaggle/working/cropcop-tracka-master-runtime-v8r3','/kaggle/working/cropcop-tracka-master-runtime-v8r4')
              nb=json.loads(full)
              meta=nb['metadata']['cropcop_operator']
              meta['schema_version']='4.4'
              meta['science_sha']=science
              meta['operator_runtime_sha']=runtime
              meta['operator_runtime_branch']=branch
              data=(json.dumps(nb,indent=2,sort_keys=True)+'\n').encode()
              p.write_bytes(data)
              paths[account]={
                  'path':p.as_posix(),
                  'sha256':hashlib.sha256(data).hexdigest(),
                  'coordinator':account=='K1',
                  'requires_historical_principal_g1':account=='K1',
              }
          manifest={
              'schema_version':'4.4','status':'LOCKED_DISTRIBUTION','authority_id':'EAAI-JE-SDL-v2.1-QA',
              'science_source_sha':science,'operator_runtime_sha':runtime,'operator_runtime_branch':branch,
              'launcher':'master_launch_guard_v8.py','driver':'master_account_driver_v8.py',
              'normal_operator_notebook_count':3,'normal_operator_notebooks':paths,
              'required_kaggle_secrets':['KAGGLE_USERNAME','KAGGLE_KEY','CROPCOP_GITHUB_TOKEN','CROPCOP_EXPECTED_KAGGLE_USERNAME'],
              'github_actions_read_permission_required_at_runtime':False,
              'attestations_packaged_in_runtime':True,
              'g1a_exact_generation_binding':True,
              'expected_account_binding_required':True,
              'kaggle':{'accelerator':'T4 x2','internet_required':True,'batch_required':True},
              'launch_protocol':{
                  'step_1':'Launch K1 only.',
                  'step_2':'Wait until K1 logs canonical G1A PASS/READY and reports the private G1A locator.',
                  'step_3':'Grant the K2 and K3 Kaggle accounts Can view access to the private canonical G1A dataset.',
                  'step_4':'Launch K2 and K3 in parallel while K1 continues its own G2A/control path.',
                  'step_5':'Use only same-notebook fresh Batch reruns for explicit controlled continuation return code 2. Investigate all other failures.'},
              'remaining_scientific_states':11,'distribution_authorizes_science':False,
              'protected_test_opened':False,'track_b_opened':False,'track_c_opened':False,
              'ddp_allowed':False,'dataparallel_allowed':False,'fsdp_allowed':False,
              'note':'v8r4 preserves packaged exact-head attestations and additionally waits for the exact newly-versioned canonical G1A seal before accepting Kaggle round-trip readiness.'
          }
          (root/'MASTER_NOTEBOOK_DISTRIBUTION_V8R4.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          old=root/'MASTER_NOTEBOOK_DISTRIBUTION_V8R3.json'
          if old.exists(): old.unlink()
          print(json.dumps(paths,indent=2))
          PY
      - name: Validate generated notebook code cells
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('journal_extension/kaggle/tracka_v12_ops')
          for p in sorted(root.glob('TRACKA_V12_MASTER_K*.ipynb')):
              nb=json.loads(p.read_text())
              for i,c in enumerate(nb['cells']):
                  if c['cell_type']=='code': compile(''.join(c['source']),f'{p.name}:{i}','exec')
          print('notebook compile PASS')
          PY
      - name: Commit generated v8r4 distribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal_extension/kaggle/tracka_v12_ops/TRACKA_V12_MASTER_K1.ipynb journal_extension/kaggle/tracka_v12_ops/TRACKA_V12_MASTER_K2.ipynb journal_extension/kaggle/tracka_v12_ops/TRACKA_V12_MASTER_K3.ipynb journal_extension/kaggle/tracka_v12_ops/MASTER_NOTEBOOK_DISTRIBUTION_V8R4.json
          git add -u journal_extension/kaggle/tracka_v12_ops/MASTER_NOTEBOOK_DISTRIBUTION_V8R3.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze deterministic Track-A v8r4 distribution'
          git push origin HEAD:ops-tracka-kaggle-master-v8r4-distribution-20260915
