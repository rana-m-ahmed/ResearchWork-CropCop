name: Validate Track-A v1.2 Kaggle distribution v8.2

on:
  push:
    branches:
      - ops-tracka-kaggle-master-v8r2-distribution-20260915
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution-coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact distribution candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up frozen Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'

      - name: Verify immutable runtime branch head and executable authority
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_BRANCH='ops-tracka-kaggle-master-runtime-v8r2-4ced2fd-20260915'
          RUNTIME_SHA='0278470dcebbaf7a7595f255854e3c4acaeabcd3'
          SCIENCE_SHA='4ced2fd7c764c07fa47fb57fbea38376d2ce61a4'
          observed="$(git ls-remote origin "refs/heads/$RUNTIME_BRANCH" | awk '{print $1}')"
          test "$observed" = "$RUNTIME_SHA"
          git fetch --quiet origin "$RUNTIME_SHA"
          git cat-file -e "$RUNTIME_SHA:journal_extension/kaggle/tracka_v12_ops/master_launch_guard_v8.py"
          git cat-file -e "$RUNTIME_SHA:journal_extension/kaggle/tracka_v12_ops/master_account_driver_v8.py"
          git show "$RUNTIME_SHA:journal_extension/kaggle/tracka_v12_ops/tracka_v12_kaggle_operator_v8.py" > /tmp/operator_v8.py
          grep -F "SCIENCE_SHA_V8 = \"$SCIENCE_SHA\"" /tmp/operator_v8.py
          grep -F 'OPERATOR_SCHEMA_VERSION_V8 = "4.2"' /tmp/operator_v8.py
          grep -F 'OPERATOR_SCHEMA_VERSION = OPERATOR_SCHEMA_VERSION_V8' /tmp/operator_v8.py

      - name: Parse and prove all three notebooks and manifest are coherent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('journal_extension/kaggle/tracka_v12_ops')
          manifest = json.loads((root / 'MASTER_NOTEBOOK_DISTRIBUTION_V8R2.json').read_text(encoding='utf-8'))
          science = '4ced2fd7c764c07fa47fb57fbea38376d2ce61a4'
          runtime = '0278470dcebbaf7a7595f255854e3c4acaeabcd3'
          runtime_branch = 'ops-tracka-kaggle-master-runtime-v8r2-4ced2fd-20260915'

          assert manifest['schema_version'] == '4.2'
          assert manifest['status'] == 'LOCKED_DISTRIBUTION'
          assert manifest['authority_id'] == 'EAAI-JE-SDL-v2.1-QA'
          assert manifest['science_source_sha'] == science
          assert manifest['operator_runtime_sha'] == runtime
          assert manifest['operator_runtime_branch'] == runtime_branch
          assert manifest['launcher'] == 'master_launch_guard_v8.py'
          assert manifest['driver'] == 'master_account_driver_v8.py'
          assert manifest['normal_operator_notebook_count'] == 3
          assert set(manifest['normal_operator_notebooks']) == {'K1','K2','K3'}
          assert manifest['remaining_scientific_states'] == 11
          assert manifest['distribution_authorizes_science'] is False
          assert manifest['protected_test_opened'] is False
          assert manifest['track_b_opened'] is False
          assert manifest['track_c_opened'] is False
          assert manifest['ddp_allowed'] is False
          assert manifest['dataparallel_allowed'] is False
          assert manifest['fsdp_allowed'] is False

          notebooks = sorted(root.glob('TRACKA_V12_MASTER_K*.ipynb'))
          expected_paths = sorted(Path(v['path']) for v in manifest['normal_operator_notebooks'].values())
          assert notebooks == expected_paths, (notebooks, expected_paths)
          assert len(notebooks) == 3

          forbidden = (
              'v8.1',
              'f8aea6c2b481f8436653d4c6504f406948a98082',
              '31d6224bd4b87c02ac3f4985d11d0a5f7a2b615d',
              '15d311df82f632a46fa420e257da8c82d0d01590',
              '9a72e9466a9a3e7429e0e36a028edac662f83146',
              '902e7774dda32106a03bfb3f5917946c11ff8e2c',
              'master_account_driver_v5.py',
              'master_g1a_sealer_compat_v6',
              'runpy.run_path',
              'init_globals',
              'DS-V1-TEST-CONSUMED',
          )

          for account in ('K1','K2','K3'):
              spec = manifest['normal_operator_notebooks'][account]
              path = Path(spec['path'])
              data = path.read_bytes()
              assert hashlib.sha256(data).hexdigest() == spec['sha256'], account
              nb = json.loads(data.decode('utf-8'))
              meta = nb['metadata']['cropcop_operator']
              assert meta == {
                  'account_id': account,
                  'authority': 'EAAI-JE-SDL-v2.1-QA',
                  'driver': 'master_account_driver_v8.py',
                  'expected_account_binding_required': True,
                  'launcher': 'master_launch_guard_v8.py',
                  'operator_runtime_branch': runtime_branch,
                  'operator_runtime_sha': runtime,
                  'schema_version': '4.2',
                  'science_sha': science,
              }, (account, meta)
              assert nb['metadata']['language_info']['version'] == '3.12.13'
              code = '\n'.join(''.join(cell.get('source', [])) for cell in nb['cells'] if cell.get('cell_type') == 'code')
              full = path.read_text(encoding='utf-8')
              assert f"OPS_RUNTIME_SHA = '{runtime}'" in code
              assert f"OPS_RUNTIME_BRANCH = '{runtime_branch}'" in code
              assert 'master_launch_guard_v8.py' in code
              assert f"str(guard), '{account}'" in code
              assert 'CROPCOP_EXPECTED_KAGGLE_USERNAME' in code
              assert 'Save & Run All' in full
              assert 'T4 x2' in full
              for token in forbidden:
                  assert token not in full, (account, token)
              if account == 'K1':
                  assert 'CROPCOP_PRINCIPAL_G1' in code
                  assert 'cropcop-g1-sealed/G1_PACKAGE' in code
              else:
                  assert 'CROPCOP_PRINCIPAL_G1' not in code
                  assert 'cropcop-g1-sealed/G1_PACKAGE' not in code

          assert not (root / 'MASTER_NOTEBOOK_DISTRIBUTION.json').exists()
          assert not (root / 'MASTER_RUNTIME_FREEZE.json').exists()
          assert not (root / '.runtime-freeze-marker').exists()
          print('v8.2 three-notebook distribution coherence PASS')
          PY

      - name: Verify distribution contains no tracked secrets or binary artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          forbidden_ext = re.compile(r'\.(?:pt|pth|ckpt|pte|safetensors|zip|tar|gz|7z|env)$', re.I)
          bad = [p for p in files if forbidden_ext.search(p)]
          if bad:
              raise SystemExit('forbidden tracked artifact(s): ' + repr(bad))
          targets = [p for p in files if p.endswith(('.ipynb','.json','.py','.yml','.yaml'))]
          for p in targets:
              try:
                  text = open(p, encoding='utf-8').read()
              except UnicodeDecodeError:
                  continue
              for marker in ('github_pat_', 'ghp_'):
                  if marker in text:
                      raise SystemExit(f'tracked secret marker {marker!r} in {p}')
          PY
