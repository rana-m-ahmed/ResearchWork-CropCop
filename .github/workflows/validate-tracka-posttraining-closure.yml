name: Validate Track-A post-training closure preparation

on:
  pull_request:
    paths:
      - 'journal_extension/TRACK_A_POSTTRAINING_CLOSURE_RUNBOOK.md'
      - 'journal_extension/locks/track_a_posttraining_closure_authority_v1.json'
      - 'journal_extension/src/cropcop_je/tracka_v12_recovery.py'
      - 'journal_extension/scripts/recover_tracka_v12_terminal_record.py'
      - 'journal_extension/scripts/build_tracka_v12_posttraining_account_readiness.py'
      - 'journal_extension/scripts/build_tracka_v12_posttraining_readiness.py'
      - 'tests/test_tracka_v12_recovery.py'
      - 'tests/test_tracka_v12_posttraining_authority.py'
      - 'tests/test_tracka_v12_posttraining_readiness.py'
      - '.github/workflows/validate-tracka-posttraining-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure-preparation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'

      - name: Verify exact checked-out head and frozen-science ancestry
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SCIENCE_BASE: 56023042e57758591df9babb3438f191dbe10312
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor "$SCIENCE_BASE" HEAD

      - name: Prove closure preparation is additive only
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 56023042e57758591df9babb3438f191dbe10312..HEAD > /tmp/tracka-closure-delta.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
              '.github/workflows/validate-tracka-posttraining-closure.yml',
              'journal_extension/TRACK_A_POSTTRAINING_CLOSURE_RUNBOOK.md',
              'journal_extension/locks/track_a_posttraining_closure_authority_v1.json',
              'journal_extension/src/cropcop_je/tracka_v12_recovery.py',
              'journal_extension/scripts/recover_tracka_v12_terminal_record.py',
              'journal_extension/scripts/build_tracka_v12_posttraining_account_readiness.py',
              'journal_extension/scripts/build_tracka_v12_posttraining_readiness.py',
              'tests/test_tracka_v12_recovery.py',
              'tests/test_tracka_v12_posttraining_authority.py',
              'tests/test_tracka_v12_posttraining_readiness.py',
          }
          changed = {line.strip() for line in Path('/tmp/tracka-closure-delta.txt').read_text().splitlines() if line.strip()}
          if changed != allowed:
              raise SystemExit(f'unexpected post-training closure delta: {sorted(changed)}')
          print('additive-only closure preparation delta PASS')
          PY

      - name: Compile new closure preparation implementation
        run: |
          python -m compileall -q \
            journal_extension/src/cropcop_je/tracka_v12_recovery.py \
            journal_extension/scripts/recover_tracka_v12_terminal_record.py \
            journal_extension/scripts/build_tracka_v12_posttraining_account_readiness.py \
            journal_extension/scripts/build_tracka_v12_posttraining_readiness.py \
            tests/test_tracka_v12_recovery.py \
            tests/test_tracka_v12_posttraining_authority.py \
            tests/test_tracka_v12_posttraining_readiness.py

      - name: Validate recovery, authority, existing evidence and comprehensive closure contracts
        run: |
          python -m unittest \
            tests.test_tracka_v12_recovery \
            tests.test_tracka_v12_posttraining_authority \
            tests.test_tracka_v12_posttraining_readiness \
            tests.test_tracka_v12_evidence \
            tests.test_tracka_v12_historical \
            tests.test_tracka_v12_comprehensive_closure \
            -v

      - name: Prove frozen scientific executors are byte-identical to science base
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            journal_extension/scripts/run_tracka_v12_direct_evidence.py \
            journal_extension/scripts/run_tracka_v12_auxiliary_evidence.py \
            journal_extension/scripts/run_tracka_v12_xai.py \
            journal_extension/scripts/seal_tracka_v12_selection.py \
            journal_extension/scripts/seal_tracka_v12_auxiliary_analysis.py \
            journal_extension/scripts/seal_tracka_v12_comprehensive_closure.py \
            journal_extension/src/cropcop_je/tracka_v12_analysis.py \
            journal_extension/src/cropcop_je/tracka_v12_evidence.py \
            journal_extension/src/cropcop_je/tracka_v12_posttraining.py \
            journal_extension/src/cropcop_je/tracka_v12_xai.py; do
              test "$(git rev-parse 56023042e57758591df9babb3438f191dbe10312:$path)" = "$(git rev-parse HEAD:$path)"
          done
          echo 'frozen post-training science implementation unchanged PASS'

      - name: Reject tracked model, checkpoint, archive and secret files
        run: |
          python - <<'PY'
          import re, subprocess
          forbidden = re.compile(r'\.(?:pt|pth|ckpt|pte|safetensors|zip|tar|gz|7z|env)$', re.I)
          offenders = [p for p in subprocess.check_output(['git','ls-files'], text=True).splitlines() if forbidden.search(p)]
          if offenders:
              raise SystemExit('forbidden tracked binary/secret artifacts: ' + repr(offenders))
          PY

      - name: Emit exact-head closure-preparation attestation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          expected = os.environ['EXPECTED_HEAD']
          if head != expected:
              raise SystemExit('head drift before attestation')
          base = '56023042e57758591df9babb3438f191dbe10312'
          changed = [x for x in subprocess.check_output(['git','diff','--name-only',f'{base}..{head}'], text=True).splitlines() if x]
          hashes = {}
          for name in changed:
              hashes[name] = hashlib.sha256(Path(name).read_bytes()).hexdigest()
          payload = {
              'schema_version':'1.0',
              'status':'PASS',
              'attestation_kind':'track_a_posttraining_closure_preparation',
              'training_science_base_git_commit':base,
              'closure_preparation_git_commit':head,
              'scientific_executors_unchanged':True,
              'protected_surfaces_opened':False,
              'training_performed':False,
              'changed_files_sha256':hashes,
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',',':')).encode()
          payload['attestation_sha256'] = hashlib.sha256(canonical).hexdigest()
          Path('TRACKA_POSTTRAINING_CLOSURE_PREP_ATTESTATION.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tracka-posttraining-closure-preparation-attestation
          path: TRACKA_POSTTRAINING_CLOSURE_PREP_ATTESTATION.json
